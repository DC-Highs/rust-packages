[package]
name = "dc-config"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Access Dragon City game configuration data (fan-made, not affiliated with SocialPoint)."
readme = "README.md"
keywords = ["dragon-city", "dchighs", "game", "discord", "telegram"]
categories = ["api-bindings", "game-development"]

[dependencies]
dc-core.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
