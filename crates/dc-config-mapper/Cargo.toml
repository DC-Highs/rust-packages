[package]
name = "dc-config-mapper"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Restructure and populate Dragon City configuration data (fan-made, not affiliated with SocialPoint)."
readme = "README.md"
keywords = ["dragon-city", "dchighs", "game", "discord", "telegram"]
categories = ["api-bindings", "game-development"]

[dependencies]
dc-core.workspace = true
dc-localization.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
pluralizer = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]
dc-config.workspace = true
